[versions]
agp = "8.9.2"
kotlin = "2.0.21"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
fragment = "1.8.6"
navigationFragment = "2.7.5"
viewModel = "2.8.7"
lottieAmination = "6.1.0"
glide = "4.16.0"
toast = "1.5.2"
lingver = "1.3.0"
circleImage = "3.1.0"
coroutines = "1.8.0"
googleGmsGoogleServices = "4.4.4"
firebaseFirestore = "26.0.2"
hilt = "2.48"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

#Navigation Fragment
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-navigation = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragment" }
androidx-navigationUi = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationFragment" }

#ViewModel
viewModel-lifecycle = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "viewModel" }
viewModel-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "viewModel" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "viewModel" }

#Splash
splash-airbnb = { group = "com.airbnb.android", name = "lottie", version.ref = "lottieAmination" }

#Glide
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
glide-bumptech = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }

#Toast
toast-grender = { group = "com.github.GrenderG", name = "Toasty", version.ref = "toast" }

#Lingver
lingver-language = { group = "com.github.YarikSOffice", name = "lingver", version.ref = "lingver" }

#CircleImage
hdodenhof-circleimage = { group = "de.hdodenhof", name = "circleimageview", version.ref = "circleImage" }

#Coroutines
coroutines-core = { group = " 'org.jetbrains.kotlin", name = "kotlinx-coroutines-core", version.ref = "coroutines"}
coroutines-android = { group = " 'org.jetbrains.kotlin", name = "kotlinx-coroutines-android", version.ref = "coroutines"}
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore", version.ref = "firebaseFirestore" }

#Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-fragment", version = "1.1.0" }
hilt-compiler-androidx = { module = "androidx.hilt:hilt-compiler", version = "1.1.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

